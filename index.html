<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D2B4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KSC ERP">
<meta name="robots" content="noindex,nofollow">
<title>KSC ERP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#0D2B4E;--navy2:#16406E;--blue:#0077C8;--blueDark:#005A9C;--bluePale:#C3D8EA;--blueSoft:#7FB4DC;
  --red:#C8102E;--redBg:#FBEAEC;--white:#FFFFFF;--text:#55606B;--muted:#98A3AE;--tint:#F5F8FB;--tint2:#E8F2FA;--border:#DBE3EB;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--tint);color:var(--text);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5}
button{font-family:inherit}
.hidden{display:none!important}
/* ---------- 상단바 ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;min-height:54px}
.bar h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back{background:none;border:0;color:#fff;font-size:22px;padding:2px 8px 2px 0;cursor:pointer;line-height:1}
.bar .sub{font-size:11px;color:var(--bluePale);font-weight:400}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(28px + var(--safe-b))}
/* ---------- 로그인 ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--navy);padding:24px}
#login .card{width:100%;max-width:360px;background:#fff;padding:32px 24px 24px;border-top:4px solid var(--blue)}
#login .brand{font-size:12px;letter-spacing:2px;color:var(--blue);font-weight:700}
#login h2{margin:6px 0 4px;color:var(--navy);font-size:24px}
#login p{margin:0 0 20px;font-size:13px}
#login input{width:100%;padding:13px 12px;border:1px solid var(--border);font-size:16px;font-family:inherit;color:var(--navy)}
#login input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
#login button{width:100%;margin-top:12px;padding:13px;background:var(--navy);color:#fff;border:0;font-size:16px;font-weight:700;cursor:pointer}
#login .err{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
/* ---------- 홈 ---------- */
.hero{background:var(--navy);color:#fff;padding:22px 20px 20px;margin:-16px -16px 18px;border-bottom:3px solid var(--blue)}
.hero .k{font-size:11px;letter-spacing:2px;color:var(--blueSoft);font-weight:700}
.hero h2{margin:4px 0 6px;font-size:24px}
.hero .v{font-size:12px;color:var(--bluePale)}
.sec{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:1px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:#fff;border:1px solid var(--border);border-left:4px solid var(--blue);padding:16px 14px;text-align:left;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{background:var(--tint2)}
.tile.main{border-left-color:var(--navy);background:var(--navy);color:#fff}
.tile.main .t{color:#fff}.tile.main .n{color:var(--bluePale)}
.tile .t{font-size:17px;font-weight:700;color:var(--navy)}
.tile .e{font-size:11px;color:var(--muted);margin-top:2px}
.tile .n{font-size:12px;color:var(--blue);font-weight:700;margin-top:10px}
.foot{margin-top:28px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
.foot button{background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;margin-top:8px;font-size:12px;cursor:pointer}
/* ---------- 목록 ---------- */
.search{width:100%;padding:12px 12px;border:1px solid var(--border);font-size:16px;font-family:inherit;background:#fff;margin-bottom:12px}
.search:focus{outline:2px solid var(--blue)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--border);padding:10px;cursor:pointer;text-align:left;width:100%}
.item:active{background:var(--tint2)}
.thumb{width:64px;height:64px;flex:none;background:var(--tint2);display:flex;align-items:center;justify-content:center;color:var(--blueSoft);font-weight:700;font-size:12px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .nm{font-weight:700;color:var(--navy);font-size:15px;line-height:1.35}
.item .ds{font-size:12px;color:var(--muted);margin-top:3px}
.item .ar{margin-left:auto;color:var(--blueSoft);font-size:20px;padding-left:4px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* ---------- 슬라이드 (PPT 형식) ---------- */
.deck-wrap{margin:0 -16px}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:0 16px 6px;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background:#fff;border:1px solid var(--border);box-shadow:0 2px 10px rgba(13,43,78,.08);display:flex;flex-direction:column;min-height:calc(100vh - 190px);position:relative}
.s-head{padding:16px 18px 10px;border-bottom:2px solid var(--navy);margin:0 14px}
.s-head .lab{font-size:11px;color:var(--blue);font-weight:700;letter-spacing:1px}
.s-head h3{margin:3px 0 0;color:var(--navy);font-size:19px;line-height:1.3}
.s-body{padding:14px 14px 10px;flex:1;display:flex;flex-direction:column;gap:12px}
.s-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 10px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin:0 14px}
.s-foot b{color:var(--navy)}
.lead{font-size:13px;color:var(--text);background:var(--tint);border-left:3px solid var(--blue);padding:8px 10px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}
.rtable th{background:var(--navy);color:#fff;font-weight:700;padding:8px 6px;text-align:center;font-size:12.5px}
.rtable td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.rtable td.l{text-align:left;color:#2a3540}
.rtable td.c{text-align:center;color:var(--muted)}
.rtable tr:nth-child(even) td{background:var(--tint)}
.rtable td.q{font-weight:700;color:var(--navy)}
.rtable tfoot td{border-top:2px solid var(--navy);font-weight:700;color:var(--navy);background:var(--tint2)!important}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--tint);padding:10px 12px;border-top:3px solid var(--blue)}
.kpi.dark{background:var(--navy);border-top-color:var(--blueSoft)}
.kpi .kl{font-size:11px;color:var(--muted);line-height:1.3}
.kpi .kv{font-size:20px;font-weight:700;color:var(--navy);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.dark .kl{color:var(--bluePale)}.kpi.dark .kv{color:#fff}
.kpi.alert{border-top-color:var(--red)}.kpi.alert .kv{color:var(--red)}
.photo{width:100%;background:var(--tint2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo.main{max-height:42vh}
.photo.step{flex:1;min-height:200px;max-height:52vh}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;flex:none}
.steptext{display:flex;gap:12px;align-items:flex-start}
.steptext .tx{white-space:pre-line;font-size:14.5px;color:#2a3540;line-height:1.6}
.steptext .tx .en{display:block;color:var(--muted);font-size:13px;margin-top:6px}
.caution{white-space:pre-line;font-size:14.5px;line-height:1.65;color:#2a3540;background:var(--redBg);border-left:4px solid var(--red);padding:12px 14px}
.nav{display:flex;align-items:center;gap:10px;margin:12px 0 0}
.nav button{background:#fff;border:1px solid var(--border);color:var(--navy);font-weight:700;padding:10px 16px;font-size:15px;cursor:pointer}
.nav button:disabled{opacity:.35}
.nav .pg{flex:1;text-align:center;font-size:13px;color:var(--navy);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1px solid var(--border);color:var(--text);padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (orientation:landscape) and (max-height:560px){
  .slide{min-height:calc(100vh - 120px)}
  .s-body.split{flex-direction:row}
  .s-body.split>*{flex:1;min-width:0}
  .photo.step,.photo.main{max-height:none}
  .bar{min-height:44px;padding-top:calc(6px + var(--safe-t));padding-bottom:6px}
}
@media(min-width:900px){.s-body.split{flex-direction:row}.s-body.split>*{flex:1;min-width:0}.slide{min-height:560px}}
/* ---------- 데이터 표 ---------- */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border)}
.dtable{border-collapse:collapse;width:100%;font-size:13px;min-width:100%}
.dtable th{position:sticky;top:0;background:var(--navy);color:#fff;padding:9px 8px;text-align:center;white-space:nowrap;font-size:12px;cursor:pointer}
.dtable td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.dtable td.l{text-align:left;white-space:normal;min-width:150px;color:#2a3540}
.dtable tr:nth-child(even) td{background:var(--tint)}
.count{font-size:12px;color:var(--muted);margin:-4px 0 8px}
/* ---------- 확대 ---------- */
#zoom{position:fixed;inset:0;background:rgba(10,20,35,.96);z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto}
#zoom img{max-width:100%;max-height:100%;touch-action:pinch-zoom}
#zoom button{position:fixed;top:calc(12px + var(--safe-t));right:12px;background:#fff;border:0;width:40px;height:40px;font-size:20px;color:var(--navy);cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;font-size:13px;z-index:60;border-left:4px solid var(--blue);max-width:90vw}
#loading{padding:60px 20px;text-align:center;color:var(--muted)}
/* ---------- 첫 화면 (ERP / 레시피) ---------- */
.big{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.big{grid-template-columns:1fr 1fr}}
.bigbtn{background:var(--navy);color:#fff;border:0;border-left:6px solid var(--blue);padding:26px 20px;text-align:left;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.bigbtn.alt{background:#fff;color:var(--navy);border:1px solid var(--border);border-left:6px solid var(--navy)}
.bigbtn:active{opacity:.85}
.bigbtn .t{font-size:28px;font-weight:700;letter-spacing:1px}
.bigbtn .e{font-size:13px;opacity:.75;margin-top:4px}
.bigbtn .n{font-size:12px;font-weight:700;margin-top:14px;color:var(--bluePale)}
.bigbtn.alt .n{color:var(--blue)}
/* ---------- ERP ---------- */
.tabs{display:flex;border-bottom:2px solid var(--navy);margin:14px 0 10px}
.tab{flex:1;background:#fff;border:1px solid var(--border);border-bottom:0;color:var(--text);padding:10px 4px;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kpis3{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:640px){.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi .ks{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.dark .ks{color:var(--bluePale)}
.dtable tr.go td{cursor:pointer}
.dtable tr.go:active td{background:var(--tint2)}
.dtable tr.grp td{background:var(--tint2)!important;color:var(--navy);font-weight:700;text-align:left}
.dtable tr.grp td.n{text-align:right}
.dtable tfoot td{border-top:2px solid var(--navy);font-weight:700;color:var(--navy);background:var(--tint2)}
.dtable td.warn{color:var(--red);font-weight:700}
.dtable.cmp td.l{min-width:120px}
.dtable.cmp tr.grp td{background:var(--navy2)!important;color:#fff;border-bottom-color:var(--navy)}
.dtable .cr{color:#E8710A;font-size:10.5px;font-weight:700;margin-left:3px}
.dtable td.mut,.dtable .mut{color:var(--muted)}
.dtable th.l{text-align:left}
.note{font-size:12px;color:var(--muted);margin:8px 0;line-height:1.6}
.storehead{display:flex;gap:8px;margin-bottom:10px}
.storehead .chip{font-size:14px;padding:8px 16px;font-weight:700}
/* ---------- 영문 병기 (한국어 아래) ---------- */
.en2{display:block;font-size:.8em;opacity:.75;font-weight:400;letter-spacing:0;line-height:1.25;white-space:normal}
.bigbtn .t .en2{font-size:14px;letter-spacing:.5px;margin-top:2px}
.hero h2 .en2{font-size:13px;margin-top:2px}
.note .en2,.foot .en2,.lead .en2{font-size:11px;margin-top:4px}
.bar .sub .en{opacity:.85}
</style>
</head>
<body>

<section id="login" class="hidden">
  <div class="card">
    <div class="brand">KSC USA</div>
    <h2>KSC ERP</h2>
    <p>이름과 개인 비밀번호를 입력하세요. 한 번 입력하면 이 기기에 기억됩니다.<span class="en2">Enter your name and personal password. It will be remembered on this device.</span><span style="display:block;margin-top:6px;color:var(--muted);font-size:12px">※ 열람 기록(이름·시간·기기)이 남습니다.<span class="en2">Access is logged (name, time, device).</span></span></p>
    <form id="loginForm">
      <input id="nm" type="text" autocomplete="username" placeholder="이름 Name (예: 홍길동)" style="margin-bottom:8px">
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 Password">
      <button type="submit" id="loginBtn">열기 Open</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <header class="bar">
    <button class="back hidden" id="backBtn" aria-label="뒤로">‹</button>
    <h1 id="title">KSC ERP</h1>
  </header>
  <main id="view"><div id="loading">불러오는 중…<span class="en2">Loading…</span></div></main>
</div>

<div id="zoom" class="hidden"><button aria-label="닫기">✕</button><img alt=""></div>
<div id="toast" class="hidden"></div>

<script>
"use strict";
const LS_KEK = "ksc_kek", LS_NAME = "ksc_name";
let KEY = null, DATA = null, META = null, USER = null;
const imgCache = new Map();

/* ---------- 암호 ---------- */
const b64 = { enc: b => btoa(String.fromCharCode(...new Uint8Array(b))), dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
const hex2buf = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
async function deriveRaw(pw, saltHex, iters) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex2buf(saltHex), iterations: iters }, base, 256);
}
const importAes = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
const aesDec = (key, u) => crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, key, u.slice(12));
async function decrypt(buf) { return aesDec(KEY, new Uint8Array(buf)); }
const normName = n => n.replace(/\s+/g, "").toLowerCase();
async function nameId(name) {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(META.nameSalt + normName(name)));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 16);
}
// 사용자 열쇠(KEK)로 이 사용자 몫의 데이터 열쇠(DK)를 푼다. 명단에서 빠졌거나 비번이 바뀌면 실패.
async function unwrapFor(name, kekRaw) {
  const ent = META.users && META.users[await nameId(name)];
  if (!ent) return null;
  try {
    const inner = JSON.parse(new TextDecoder().decode(await aesDec(await importAes(kekRaw), b64.dec(ent.wrap))));
    return { key: await importAes(hex2buf(inner.dk)), name: inner.name };
  } catch { return null; }
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

/* ---------- 부팅 ---------- */
async function boot() {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  try { META = await (await fetch("meta.json", { cache: "no-store" })).json(); }
  catch { toast("오프라인 — 저장된 자료로 엽니다 / Offline — opening saved data"); META = JSON.parse(store.get("ksc_meta") || "null"); }
  if (!META) { document.body.innerHTML = "<p style='padding:30px'>자료를 불러오지 못했습니다. 인터넷 연결을 확인하세요.<br>Could not load data. Check your internet connection.</p>"; return; }
  store.set("ksc_meta", JSON.stringify(META));
  store.del("ksc_recipe_key"); store.del("ksc_recipe_salt");  // 예전 공용 비밀번호 방식 흔적 정리
  const kek = store.get(LS_KEK), nm = store.get(LS_NAME);
  if (kek && nm) {
    const r = await unwrapFor(nm, b64.dec(kek));
    if (r) { KEY = r.key; USER = r.name; return start("앱 열기"); }
    store.del(LS_KEK);
    document.getElementById("loginErr").textContent = "접속 권한이 바뀌었습니다. 다시 로그인하세요. / Access changed. Please log in again.";
  }
  if (nm) document.getElementById("nm").value = nm;
  showLogin();
}
function showLogin() {
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  setTimeout(() => document.getElementById(document.getElementById("nm").value ? "pw" : "nm").focus(), 50);
}
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
  btn.disabled = true; btn.textContent = "확인 중… Checking…"; err.textContent = "";
  try {
    const name = document.getElementById("nm").value.trim();
    if (!name) { err.textContent = "이름을 입력하세요. / Enter your name."; return; }
    const ent = META.users && META.users[await nameId(name)];
    if (!ent) { err.textContent = "등록되지 않은 이름입니다. 관리자에게 문의하세요. / Name not registered. Contact the admin."; return; }
    const raw = await deriveRaw(document.getElementById("pw").value, ent.salt, META.iterations);
    const r = await unwrapFor(name, raw);
    if (!r) { err.textContent = "비밀번호가 맞지 않습니다. / Incorrect password."; return; }
    store.set(LS_KEK, b64.enc(raw)); store.set(LS_NAME, name);
    KEY = r.key; USER = r.name; document.getElementById("login").classList.add("hidden"); start("로그인");
  } catch (x) { err.textContent = "오류 Error: " + x.message; }
  finally { btn.disabled = false; btn.textContent = "열기 Open"; }
});

async function start(ev) {
  document.getElementById("app").classList.remove("hidden");
  const res = await fetch("data.bin?v=" + META.ver);
  DATA = JSON.parse(new TextDecoder().decode(await decrypt(await res.arrayBuffer())));
  const last = store.get("ksc_seen_ver");
  if (last && last !== META.ver) toast("새 자료로 업데이트되었습니다 / Updated to new data (" + DATA.meta.builtAt + ")");
  store.set("ksc_seen_ver", META.ver);
  logEvent(ev, "");
  route();
}

/* ---------- 접속 기록 (구글시트) ---------- */
function device() {
  const u = navigator.userAgent;
  const os = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Windows/.test(u) ? "Windows" : /Mac/.test(u) ? "Mac" : "기타";
  const br = /SamsungBrowser/.test(u) ? "삼성인터넷" : /KAKAOTALK/i.test(u) ? "카카오톡" : /CriOS|Chrome/.test(u) ? "Chrome" : /Safari/.test(u) ? "Safari" : "";
  const app = matchMedia("(display-mode: standalone)").matches || navigator.standalone ? "앱" : "브라우저";
  return [os, br, app].filter(Boolean).join(" · ");
}
function logEvent(event, detail) {
  if (!DATA || !DATA.meta.logUrl || !USER) return;
  const k = event + "|" + detail, now = Date.now();
  logEvent.recent = logEvent.recent || {};
  if (logEvent.recent[k] && now - logEvent.recent[k] < 5 * 60 * 1000) return;  // 같은 화면 5분 내 반복은 1번만
  logEvent.recent[k] = now;
  let q = []; try { q = JSON.parse(store.get("ksc_logq") || "[]"); } catch {}
  q.push({ name: USER, event, detail, device: device(), ver: META.ver, at: new Date().toISOString() });
  store.set("ksc_logq", JSON.stringify(q.slice(-200)));
  flushLogs();
}
async function flushLogs() {
  if (flushLogs.busy || !navigator.onLine || !DATA || !DATA.meta.logUrl) return;
  flushLogs.busy = true;
  try {
    let q = []; try { q = JSON.parse(store.get("ksc_logq") || "[]"); } catch {}
    if (!q.length) return;
    await fetch(DATA.meta.logUrl, { method: "POST", mode: "no-cors", keepalive: true,
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ token: DATA.meta.logToken, rows: q }) });
    store.set("ksc_logq", JSON.stringify(JSON.parse(store.get("ksc_logq") || "[]").slice(q.length)));
  } catch {} finally {
    flushLogs.busy = false;
    let left = []; try { left = JSON.parse(store.get("ksc_logq") || "[]"); } catch {}
    if (left.length && navigator.onLine) setTimeout(flushLogs, 1500);  // 보내는 중에 쌓인 기록도 이어서 전송
  }
}
window.addEventListener("online", flushLogs);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushLogs(); });

/* ---------- 사진 ---------- */
async function imgUrl(id) {
  if (!id) return null;
  if (imgCache.has(id)) return imgCache.get(id);
  const p = (async () => {
    const r = await fetch("img/" + id + ".bin");
    if (!r.ok) throw new Error(r.status);
    const plain = await decrypt(await r.arrayBuffer());
    return URL.createObjectURL(new Blob([plain], { type: "image/jpeg" }));
  })();
  imgCache.set(id, p);
  return p;
}
function hydrateImages(root) {
  const io = "IntersectionObserver" in window ? new IntersectionObserver(ents => {
    ents.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); load(en.target); } });
  }, { rootMargin: "300px" }) : null;
  const load = el => imgUrl(el.dataset.img).then(u => {
    if (!u) return; const im = new Image(); im.src = u; im.alt = ""; el.textContent = ""; el.appendChild(im);
    if (el.classList.contains("photo")) el.onclick = () => zoom(u);
  }).catch(() => { el.textContent = "사진 없음 No photo"; });
  root.querySelectorAll("[data-img]").forEach(el => io ? io.observe(el) : load(el));
}
function zoom(u) {
  const z = document.getElementById("zoom"); z.querySelector("img").src = u; z.classList.remove("hidden");
}
document.getElementById("zoom").addEventListener("click", e => { if (e.target.tagName !== "IMG") e.currentTarget.classList.add("hidden"); });

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 0) => v == null || isNaN(v) ? "-" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const usd = (v, d = 2) => v == null ? "-" : "$" + fmt(v, d);
const pct = (v, d = 1) => v == null ? "-" : fmt(v * 100, d) + "%";
const qtyFmt = v => v == null ? "-" : (Math.abs(v - Math.round(v)) < 1e-9 ? fmt(v, 0) : fmt(v, v < 10 ? 2 : 1));
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 3500);
}
function splitKoEn(t) {
  // "1. 한글...\n1. English..." → 한글/영문 분리 (영문 시작 줄부터 영문)
  const lines = t.split("\n"); let idx = -1;
  for (let i = 1; i < lines.length; i++) {
    const s = lines[i].replace(/^\s*\d+\s*[.)]\s*/, "");
    if (/^[A-Za-z(]/.test(s) && !/[가-힣]/.test(lines[i])) { idx = i; break; }
  }
  if (idx < 0) return { ko: t, en: "" };
  return { ko: lines.slice(0, idx).join("\n").trim(), en: lines.slice(idx).join("\n").replace(/\n(?!\s*\d+[.)])/g, " ").trim() };
}
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };

function erpCmpView(v, kind, mon) {
  const e = ERP(), sts = Object.keys(e.stores);
  kind = kind === "cost" ? "cost" : "pmix";
  const mons = [...new Set(sts.flatMap(st => e.stores[st].months))].sort();
  mon = mons.includes(mon) ? mon : mons[mons.length - 1];
  setBar(`${kind === "cost" ? "원가 비교" : "Pmix 비교"} <span class="sub">${kind === "cost" ? "Cost Comparison" : "P-Mix Comparison"} · ${monEn(mon)}</span>`, true);
  const D = {};
  sts.forEach(st => {
    const s = e.stores[st], ds = s.days.filter(x => x.d.startsWith(mon));
    D[st] = { s, ds, net: ds.reduce((a, x) => a + (x.net || 0), 0), theo: ds.reduce((a, x) => a + x.theo, 0),
      food: ds.reduce((a, x) => a + x.food, 0), last: ds.length ? ds[ds.length - 1].d.slice(5) : "-" };
  });
  const head = `<div class="storehead">${[["pmix", "Pmix 비교" + "<span class=\"en2\">P-Mix Comparison</span>"], ["cost", "원가 비교" + "<span class=\"en2\">Cost Comparison</span>"]].map(([k, t]) => `<button class="chip${k === kind ? " on" : ""}" onclick="location.replace('#/erp/cmp/${k}/${mon}')">${t}</button>`).join("")}</div>
    <div class="chips">${mons.slice().reverse().map(m => `<button class="chip${m === mon ? " on" : ""}" onclick="location.replace('#/erp/cmp/${kind}/${m}')">${monChip(m)}</button>`).join("")}</div>`;
  const th = `<th class="l">항목<span class="en2">Item</span></th>${sts.map(st => `<th>${st}</th>`).join("")}`;
  if (kind === "cost") {
    const val = st => {
      const a = (D[st].s.actual || {})[mon] || null, net = D[st].net;
      const use = a && a.open != null && a.close != null ? a.open + a.rcv - a.close : null;
      return { a, net, use, ar: ratio(use, net), tr: ratio(D[st].theo, net) };
    };
    const V = Object.fromEntries(sts.map(st => [st, val(st)]));
    const money = x => x == null ? `<span class="warn">미입력 Not entered</span>` : usd(x, 0);
    const row = (lab, f, cls) => `<tr${cls ? ` class="${cls}"` : ""}><td class="l">${lab}</td>${sts.map(st => `<td>${f(V[st], st)}</td>`).join("")}</tr>`;
    v.innerHTML = `${head}
      <div class="tbl-wrap"><table class="dtable"><thead><tr>${th}</tr></thead><tbody>
        ${row("기초재고금액<span class=\"en2\">Opening Inventory</span>", x => x.a ? money(x.a.open) : "-")}
        ${row("입고금액<span class=\"en2\">Purchases</span>", x => x.a ? usd(x.a.rcv, 0) : "-")}
        ${row("기말재고금액<span class=\"en2\">Closing Inventory</span>", x => x.a ? money(x.a.close) : "-")}
        ${row("사용금액 (기초+입고−기말)<span class=\"en2\">Usage (Opening + Purchases − Closing)</span>", x => x.use == null ? "-" : usd(x.use, 0))}
        ${row("Net Sales", x => usd(x.net, 0))}
        ${row("재고반영 원가율 (Net Sales 기준)<span class=\"en2\">Actual Food Cost % (inventory-adjusted, of Net Sales)</span>", x => x.ar == null ? "-" : `<b>${pct(x.ar)}</b>`, "grp")}
        ${row("이론원가율 (참고)<span class=\"en2\">Theoretical Cost % (ref.)</span>", x => pct(x.tr))}
        ${row("차이 (재고반영 − 이론)<span class=\"en2\">Variance (Actual − Theoretical)</span>", x => x.ar == null || x.tr == null ? "-" : `<b style="color:var(--red)">${x.ar - x.tr >= 0 ? "+" : ""}${fmt((x.ar - x.tr) * 100, 1)}%p</b>`)}
      </tbody></table></div>
      <div class="note">${monLabel(mon)} · 매출 기준일 ${sts.map(st => `${st} ~${D[st].last}`).join(" · ")}<br>
        재고반영 원가율 = (기초재고 + 입고 − 기말재고) ÷ Net Sales. 재고·입고 = 드라이브 매장별 Cost Calculation, Net Sales = 매출 대시보드.
        기말재고가 '미입력'이면 드라이브 시트에 월말 재고가 아직 없는 것입니다.
        <span class="en2">${monEn(mon)} · Sales through ${sts.map(st => `${st} ${D[st].last}`).join(" · ")}<br>
        Actual food cost % = (opening inventory + purchases − closing inventory) ÷ Net Sales. Inventory & purchases: each store's Cost Calculation sheet on Google Drive; Net Sales: sales dashboard.
        'Not entered' means the month-end inventory is not yet in the Drive sheet.</span></div>`;
    return;
  }
  // Pmix 비교: 메뉴 이름으로 두 매장 합침
  const rows = new Map();
  sts.forEach(st => {
    const s = D[st].s;
    erpAgg(s, D[st].ds.map(x => x.d)).forEach(([q, sl], i) => {
      const it = s.items[i], k = it[1];
      if (!rows.has(k)) rows.set(k, { name: k, g: it[0], v: {} });
      const r = rows.get(k);
      r.v[st] = { q, sl, c: it[2] != null ? q * it[2] : 0 };
    });
  });
  const groups = new Map();
  rows.forEach(r => { if (!groups.has(r.g)) groups.set(r.g, []); groups.get(r.g).push(r); });
  const sum = (list, st, f) => list.reduce((a, r) => a + (r.v[st] ? r.v[st][f] : 0), 0);
  const all = [...rows.values()];
  const cells = (list, bold) => ["c", "q", "sl"].map(f => sts.map(st => {   // 이론원가(+원가율)를 맨 앞에
    const x = sum(list, st, f), sl = sum(list, st, "sl");
    const cr = f === "c" && !bold && x && sl ? `<span class="cr">(${pct(x / sl)})</span>` : "";   // 메뉴별 원가율 = 이론원가 ÷ 메뉴 매출
    return `<td${bold ? ' class="n"' : ""}>${x ? (f === "q" ? qtyFmt(x) : usd(x, 0)) : "-"}${cr}</td>`;
  }).join("")).join("");
  const gl = [...groups.entries()].map(([g, list]) => ({ g, list, c: sts.reduce((a, st) => a + sum(list, st, "c"), 0) }))
    .sort((a, b) => b.c - a.c);
  const body = gl.map(({ g, list }) => `<tr class="grp"><td>${esc(g)}</td>${cells(list, true)}</tr>` +
    list.sort((a, b) => sts.reduce((t, st) => t + (b.v[st]?.q || 0) - (a.v[st]?.q || 0), 0))

// 기간 P-Mix 집계: itemIdx → [qty, sales]
function erpAgg(s, dates) {
  const m = new Map();
  dates.forEach(d => (s.dayItems[d] || []).forEach(([i, q, sl]) => {
    const a = m.get(i) || [0, 0]; a[0] += q; a[1] += sl; m.set(i, a);
  }));
  return m;
}
function pmixTable(s, agg, net) {
  const groups = new Map();
  agg.forEach(([q, sl], i) => {
    const it = s.items[i], cost = it[2] != null ? q * it[2] : null;
    if (!groups.has(it[0])) groups.set(it[0], []);
    groups.get(it[0]).push({ it, q, sl, cost });
  });
  const tot = { q: 0, sl: 0, c: 0 };
  const gl = [...groups.entries()].map(([g, rows]) => {
    const gq = rows.reduce((a, r) => a + r.q, 0), gs = rows.reduce((a, r) => a + r.sl, 0), gc = rows.reduce((a, r) => a + (r.cost || 0), 0);
    tot.q += gq; tot.sl += gs; tot.c += gc;
    rows.sort((a, b) => (b.cost || 0) - (a.cost || 0) || b.q - a.q);
    return { g, rows, gq, gs, gc };
  }).sort((a, b) => b.gc - a.gc);
  const body = gl.map(({ g, rows, gq, gs, gc }) => `
    <tr class="grp"><td>${esc(g)}</td><td class="n">${qtyFmt(gq)}</td><td class="n">${usd(gs, 0)}</td><td></td><td class="n">${usd(gc, 0)}</td><td class="n">${pct(ratio(gc, net))}</td></tr>
    ${rows.map(({ it, q, sl, cost }) => `<tr><td class="l">${esc(it[1])}${it[4] ? ` <span style="color:${it[4] === "제외" ? "var(--muted)" : "var(--red)"};font-size:11px">[${ST_EN[it[4]] || it[4]}]</span>` : ""}</td>
      <td>${qtyFmt(q)}</td><td>${usd(sl, 0)}</td><td class="${it[2] == null ? "warn" : ""}">${it[2] == null ? "?" : usd(it[2])}</td>
      <td class="q">${cost == null ? "-" : usd(cost, 0)}</td><td>${pct(ratio(cost, net))}</td></tr>`).join("")}`).join("");
  return `<div class="tbl-wrap"><table class="dtable"><thead><tr><th class="l">메뉴 (Menu Group)</th><th>수량<span class="en2">Qty</span></th><th>매출<span class="en2">Sales</span></th><th>단위원가<span class="en2">Unit Cost</span></th><th>이론원가<span class="en2">Theo. Cost</span></th><th>Net 대비<span class="en2">% of Net</span></th></tr></thead>
    <tbody>${body || `<tr><td colspan="6" class="l" style="text-align:center;padding:24px">판매 기록 없음 · No sales</td></tr>`}</tbody>
    <tfoot><tr><td class="l">합계 Total</td><td>${qtyFmt(tot.q)}</td><td>${usd(tot.sl, 0)}</td><td></td><td>${usd(tot.c, 0)}</td><td>${pct(ratio(tot.c, net))}</td></tr></tfoot></table></div>`;
}

     ${r.photo ? `<div class="photo main" data-img="${r.photo}"></div>` : ""}
     <div><div class="kpis">${kp.join("")}</div>
     ${supR != null && tgtR != null ? `<div class="lead" style="margin-top:10px">공급원가율 ${pct(supR)} — 목표 ${pct(tgtR, 0)} 대비 ${supR > tgtR ? `<b style="color:var(--red)">${fmt((supR - tgtR) * 100, 1)}%p 초과</b>` : `${fmt((tgtR - supR) * 100, 1)}%p 여유`}<span class="en2">Purchase cost ratio ${pct(supR)} — ${supR > tgtR ? `<b style="color:var(--red)">${fmt((supR - tgtR) * 100, 1)}%p over</b>` : `${fmt((tgtR - supR) * 100, 1)}%p under`} target ${pct(tgtR, 0)}</span></div>` : ""}</div>` });
  // 3) 원가 상세
  const cpages = chunk(ings, 12);
  cpages.forEach((rows, pi) => {
    S.push({ lab: `${lab} · 원가 상세 COST DETAIL`, title: name + (cpages.length > 1 ? ` (${pi + 1}/${cpages.length})` : ""), body: `
      <table class="rtable"><thead><tr><th>재료<span class="en2">Ingredient</span></th><th style="width:52px">수율<span class="en2">Yield</span></th><th style="width:66px">총중량g<span class="en2">Gross g</span></th><th style="width:64px">원가<span class="en2">Cost</span></th><th style="width:52px">비중<span class="en2">Share</span></th></tr></thead>
      <tbody>${rows.map(x => `<tr><td class="l">${esc(x.name)}</td><td>${x.yield != null ? pct(x.yield, 0) : "-"}</td><td>${qtyFmt(x.gross)}</td><td class="q">${usd(x.cost)}</td><td>${pct(x.ratio)}</td></tr>`).join("")}</tbody>
      ${pi === cpages.length - 1 ? `<tfoot><tr><td class="l">합계 Total</td><td></td><td>${qtyFmt(r.total.gross)}</td><td>${usd(r.total.cost)}</td><td>100%</td></tr></tfoot>` : ""}</table>` });
  });
  // 4) 주의사항
  if (r.caution) {
    const { ko, en } = splitKoEn(r.caution);
    S.push({ lab: `${lab} · 주의사항 CAUTION`, title: name, body: `<div class="caution">${esc(ko)}</div>${en ? `<div class="lead" style="white-space:pre-line">${esc(en)}</div>` : ""}` });
  }
  // 5) 조리 순서 — 한 장에 한 단계
  r.steps.forEach((s, i) => {
    const { ko, en } = splitKoEn(s.text);
    const m = ko.match(/^\s*(\d+)\s*[.)]\s*/);
    const no = m ? m[1] : i + 1;
    S.push({ lab: `${lab} · 조리 순서 STEP ${i + 1}/${r.steps.length}`, title: name, split: !!s.img, body: `
      ${s.img ? `<div class="photo step" data-img="${s.img}"></div>` : ""}
      <div class="steptext"><span class="stepno">${no}</span><div class="tx">${esc(ko.replace(/^\s*\d+\s*[.)]\s*/, ""))}${en ? `<span class="en">${esc(en)}</span>` : ""}</div></div>` });
  });
  return S;
}
function recipeView(v, k, idx, start) {
  const r = DATA[k][idx];
  if (!r) { location.hash = "#/list/" + k; return; }
  setBar(esc(recName(r)), true);
  const S = buildSlides(r, k);
  const jumps = [["레시피<span class=\"en2\">Recipe</span>", 0]];
  const ci = S.findIndex(s => /원가 요약/.test(s.lab)); if (ci >= 0) jumps.push(["원가<span class=\"en2\">Cost</span>", ci]);
  const ui = S.findIndex(s => /주의사항/.test(s.lab)); if (ui >= 0) jumps.push(["주의사항<span class=\"en2\">Caution</span>", ui]);
  const si = S.findIndex(s => /조리 순서/.test(s.lab)); if (si >= 0) jumps.push(["조리 순서<span class=\"en2\">Steps</span>", si]);
  v.innerHTML = `
    <div class="chips">${jumps.map(([t, i]) => `<button class="chip" data-go="${i}">${t}</button>`).join("")}</div>
    <div class="deck-wrap"><div class="deck" id="deck">${S.map((s, i) => `
      <article class="slide">
        <div class="s-head"><div class="lab">${s.lab}</div><h3>${s.title}</h3></div>
        <div class="s-body${s.split ? " split" : ""}">${s.body}</div>
        <div class="s-foot"><span>KSC USA · ${CATS[k].title} ${CATS[k].en}</span><b>${i + 1} / ${S.length}</b></div>
      </article>`).join("")}</div></div>
    <div class="nav"><button id="prv">‹ 이전 Prev</button><div class="pg" id="pg"></div><button id="nxt">다음 Next ›</button></div>
    <div class="nav" style="margin-top:8px">
      <button id="prevRec" ${idx <= 0 ? "disabled" : ""}>‹ 이전 메뉴 Prev menu</button><div class="pg"></div>
      <button id="nextRec" ${idx >= DATA[k].length - 1 ? "disabled" : ""}>다음 메뉴 Next menu ›</button></div>`;
  const deck = document.getElementById("deck"), pg = document.getElementById("pg");
  const cur = () => Math.round(deck.scrollLeft / (deck.firstElementChild.offsetWidth + 12));
  const go = i => deck.scrollTo({ left: Math.max(0, Math.min(S.length - 1, i)) * (deck.firstElementChild.offsetWidth + 12), behavior: "smooth" });
  const upd = () => {
    const c = cur(); pg.textContent = `${c + 1} / ${S.length}`;
    document.getElementById("prv").disabled = c <= 0; document.getElementById("nxt").disabled = c >= S.length - 1;
    let on = 0; jumps.forEach(([, i], j) => { if (c >= i) on = j; });
    v.querySelectorAll(".chip").forEach((ch, j) => ch.classList.toggle("on", j === on));
  };
  deck.addEventListener("scroll", () => { clearTimeout(upd._t); upd._t = setTimeout(upd, 60); });
  document.getElementById("prv").onclick = () => go(cur() - 1);
  document.getElementById("nxt").onclick = () => go(cur() + 1);
  document.getElementById("prevRec").onclick = () => location.replace(`#/r/${k}/${idx - 1}`);
  document.getElementById("nextRec").onclick = () => location.replace(`#/r/${k}/${idx + 1}`);
  v.querySelectorAll(".chip").forEach(ch => ch.onclick = () => go(+ch.dataset.go));
  document.onkeydown = e => { if (e.key === "ArrowRight") go(cur() + 1); if (e.key === "ArrowLeft") go(cur() - 1); };
  hydrateImages(deck);
  requestAnimationFrame(() => { if (start) deck.scrollLeft = start * (deck.firstElementChild.offsetWidth + 12); upd(); });
}

/* ---------- 표 ---------- */
const COLFMT = {
  ingredients: [null, null, null, v => usd(v, 2), null, v => qtyFmt(v), v => usd(v, 5), v => qtyFmt(v)],
  yield: [null, v => typeof v === "number" ? pct(v, 0) : esc(v)],
  prepCost: [null, v => qtyFmt(v), v => usd(v, 2), v => usd(v, 5)],
};
const TEXTCOL = { ingredients: [1], yield: [0], prepCost: [0] };
const COL_EN = { "코드": "Code", "품명": "Item", "규격": "Spec", "매입단가($)": "Purchase Price ($)", "가공단위": "Proc. Unit",
  "가공수량": "Proc. Qty", "g당 단가($)": "Price per g ($)", "수율": "Yield", "전처리명": "Prep Item",
  "사용 총중량(g)": "Total Gross (g)", "공급가($)": "Cost ($)", "g당 원가($)": "Cost per g ($)" };
function tableView(v, k) {
  const c = CATS[k], t = DATA[k];
  setBar(`${c.title} <span class="sub">${c.en} · ${t.rows.length}</span>`, true);
  let sortCol = -1, asc = true;
  v.innerHTML = `<input class="search" type="search" placeholder="${c.title} 검색 · Search (품명·코드 name/code)" id="q"><div class="count" id="cnt"></div>
    <div class="tbl-wrap"><table class="dtable"><thead><tr>${t.columns.map((h, i) => `<th data-i="${i}">${esc(h)}${COL_EN[h] ? `<span class="en2">${COL_EN[h]}</span>` : ""}</th>`).join("")}</tr></thead><tbody id="tb"></tbody></table></div>`;
  const tb = document.getElementById("tb"), q = document.getElementById("q");
  const fm = COLFMT[k] || [], tc = TEXTCOL[k] || [];
  const draw = () => {
    const s = q.value.trim().toLowerCase();
    let rows = t.rows.filter(r => !s || r.join(" ").toLowerCase().includes(s));
    if (sortCol >= 0) rows = rows.slice().sort((a, b) => {
      const x = a[sortCol], y = b[sortCol];
      const r = typeof x === "number" && typeof y === "number" ? x - y : String(x ?? "").localeCompare(String(y ?? ""), "ko");
      return asc ? r : -r;
    });
    document.getElementById("cnt").textContent = `${rows.length}개 항목 · 머리글을 누르면 정렬 / ${rows.length} items · tap a header to sort`;
    tb.innerHTML = rows.map(r => `<tr>${r.map((x, i) => `<td class="${tc.includes(i) ? "l" : ""}">${fm[i] && x != null && x !== "" ? fm[i](x) : esc(x ?? "")}</td>`).join("")}</tr>`).join("")
      || `<tr><td colspan="${t.columns.length}" class="l" style="text-align:center;padding:24px">검색 결과가 없습니다 · No results</td></tr>`;
  };
  v.querySelectorAll("th").forEach(th => th.onclick = () => { const i = +th.dataset.i; asc = sortCol === i ? !asc : true; sortCol = i; draw(); });
  q.oninput = draw; draw();
}

boot();
</script>
